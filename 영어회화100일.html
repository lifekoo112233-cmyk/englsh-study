<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>영어회화 100일</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; max-width: 480px; margin: 0 auto; min-height: 100vh; }
.header { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 14px 16px; position: sticky; top: 0; z-index: 10; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.app-title { font-size: 17px; font-weight: 600; }
.progress-text { font-size: 13px; color: #888; }
.tab-bar { display: flex; gap: 0; border-bottom: 1px solid #e8e8e8; background: #fff; }
.tab-btn { flex: 1; padding: 11px 4px; font-size: 13px; font-weight: 500; border: none; background: none; color: #888; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }

/* 학습 탭 */
.learn-container { padding: 16px; }
.day-selector { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.day-nav { width: 36px; height: 36px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.day-nav:active { background: #f0f0f0; }
.day-info { flex: 1; text-align: center; }
.day-label { font-size: 13px; color: #888; }
.day-title { font-size: 15px; font-weight: 600; margin-top: 2px; }

/* 문장 카드 */
.sentence-card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 12px; border: 1px solid #e8e8e8; min-height: 80px; display: flex; flex-direction: column; gap: 8px; }
.sentence-en { font-size: 17px; font-weight: 500; line-height: 1.5; }
.sentence-actions { display: flex; gap: 8px; margin-top: 4px; }
.btn-speak { padding: 6px 12px; border: 1px solid #ddd; border-radius: 20px; background: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px; color: #555; }
.btn-speak:active { background: #f0f7ff; border-color: #2563eb; color: #2563eb; }
.btn-memo { padding: 6px 12px; border: 1px solid #ddd; border-radius: 20px; background: #fff; font-size: 13px; cursor: pointer; color: #555; }
.btn-memo.saved { border-color: #f59e0b; color: #f59e0b; background: #fffbeb; }
.btn-memo:active { background: #fffbeb; }

/* 전체 듣기 버튼 */
.listen-all-btn { width: 100%; padding: 13px; border: 1px solid #2563eb; border-radius: 12px; background: #eff6ff; color: #2563eb; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.listen-all-btn.playing { background: #2563eb; color: #fff; }
.listen-all-btn:active { opacity: 0.9; }

/* 속도 조절 */
.speed-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; background: #fff; padding: 10px 14px; border-radius: 10px; border: 1px solid #e8e8e8; }
.speed-label { font-size: 13px; color: #555; white-space: nowrap; }
.speed-bar input[type=range] { flex: 1; }
.speed-val { font-size: 13px; font-weight: 600; min-width: 30px; color: #2563eb; }

/* 목록 탭 */
.day-list { padding: 8px; }
.day-card { background: #fff; border-radius: 12px; padding: 13px 16px; margin-bottom: 8px; border: 1px solid #e8e8e8; display: flex; align-items: center; cursor: pointer; gap: 12px; }
.day-card:active { background: #f0f7ff; }
.day-card.done { border-left: 3px solid #22c55e; }
.day-num-badge { width: 36px; height: 36px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #555; flex-shrink: 0; }
.day-card.done .day-num-badge { background: #dcfce7; color: #16a34a; }
.day-card-info { flex: 1; min-width: 0; }
.day-card-label { font-size: 11px; color: #aaa; }
.day-card-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.day-card-count { font-size: 12px; color: #aaa; }

/* 저장 탭 */
.saved-list { padding: 8px; }
.saved-item { background: #fff; border-radius: 10px; padding: 13px 14px; margin-bottom: 8px; border: 1px solid #e8e8e8; display: flex; align-items: center; gap: 10px; }
.saved-sentence { flex: 1; font-size: 14px; line-height: 1.4; }
.btn-play-saved { width: 34px; height: 34px; border: 1px solid #ddd; border-radius: 50%; background: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-play-saved:active { background: #f0f7ff; }
.btn-del-saved { width: 28px; height: 28px; border: none; background: none; font-size: 16px; color: #ccc; cursor: pointer; flex-shrink: 0; }
.empty-state { text-align: center; padding: 60px 20px; color: #aaa; font-size: 14px; }

/* 현재 재생 중 하이라이트 */
.sentence-card.playing { border-color: #2563eb; background: #eff6ff; }
</style>
</head>

ssues?", "Most importantly, you need to drink less.", "Do you want to try rock climbing?", "Um, can we do something a little less dangerous?", "It’s not dangerous if you have the right equipment!", "Still, it’s a little too much for me."]}, "90": {"title": "When was the last time ~ ?", "sentences": ["When was the last time you slept really well?", "When was the last time you visited your grandma?", "When was the last time you hung out with Jacob?", "When was the last time you went on a date?", "When was the last time you went out for drinks?", "Hey, Hailey, when was the last time you went to the cinema?", "I’m not sure. Maybe Christmas Day, two years ago.", "I’m feeling lost these days.", "Really? When was the last time you went to a fortune teller?", "I’ve never been to a fortune teller.", "I think that would help give you some direction."]}, "91": {"title": "I think ~", "sentences": ["I think we’re on a one-way street.", "I think I forgot to turn off the air conditioner.", "I think I got on the wrong train.", "I think I hurt his feelings. He won’t text me back.", "I think I left my keys in the restaurant.", "I think I offended your brother.", "Don’t worry about him. He seemed fine when I saw him last night.", "How was the exam?", "Not bad, but I think I messed up on the last part.", "Why? What happened?", "I think I did some calculations wrong."]}, "92": {"title": "Do you think ~ ?", "sentences": ["Do you think you can get off work early today?", "Do you think you can join us for dinner tonight?", "Do you think you can pitch tomorrow?", "Do you think you could lend me ten dollars?", "Do you think you could pick me up from the airport?", "My brother works for Google.", "Really? Do you think he could get me a job?", "Do you think you could pick up some groceries on your way home?", "Sure. Can you text me a list?", "Will do. Could you also stop by the pharmacy?", "Sure, and if I do all that, do you think we can order pizza tonight?"]}, "93": {"title": "What makes you end’s café.", "Sure. We’d love to travel up there.", "You live in Bundang, too?", "Yeah. The subway is exhausting during rush hour.", "Well, if you ever need a ride to work, we could carpool.", "That would be amazing. Thank you."]}, "97": {"title": "Do you want me to ~ ?", "sentences": ["Do you want me to grab you anything?", "I just made dinner. Do you want me to wait for you?", "Do you want me to cancel my plans tonight?", "Do you want me to help you with that?", "Do you want me to get started on that presentation?", "I need to go to the bank at lunch today.", "Oh, do you want me to come with you to help interpret?", "I need to send this package tomorrow, but I don’t have time.", "Do you want me to do it?", "That would be so nice.", "Happy to help. I’ll do it on my way to the gym."]}, "98": {"title": "haven’t/hasn’t + p.p.", "sentences": ["I haven’t been to the gym in a while.", "I haven’t seen him in a while.", "I haven’t taken public transportation in months.", "He hasn’t dated anyone in three years.", "I haven’t played video games in 10 years, at least.", "Have you seen Sally lately?", "No, I haven’t seen her in a while.", "Can we go shopping this weekend?", "Sounds good. I need some summer clothes.", "Yeah, we haven’t been to the department store for months.", "Oh, right. Since early spring. How about we go before dinner with my mom?"]}, "99": {"title": "If + 과거, would ~", "sentences": ["If I won the lottery, I’d buy a house in Hawaii.", "If I had a spare room, I’d put you up.", "If I had more time, I could help you out.", "If I were single, I would ask her out.", "If it was cheaper, I would buy it in a heartbeat.", "Everything in my hometown closes at 8 p.m.", "If I couldn’t go anywhere after 8 p.m., I’d go crazy.", "Let’s go to a bar in Gangnam next.", "Actually, I need to go home now.", "This early? It’s only 9 p.m.", "I would stay out longer if I didn’t work tomorrow."]}, "100": {"title": "I wish ~", "sentences": ["I really wish I could be there.", "I wish I could move to Europe.", "I wish I could eat seafood. It’s healthier than red meat.", "I wish I could dance like you.", "He told me that he wished he could be here.", "This trip is such a drag. Why did we even come?", "Seriously? I wish we could stay longer.", "Hey, Mom, I have some bad news.", "Oh, no. What is it, Honey?", "I wish I could visit over the holiday, but I’m going to be stuck at work.", "Isn’t there someone else who could fill in for you?"]}};

let currentDay = 1;
let savedSentences = JSON.parse(localStorage.getItem('saved_sentences') || '[]');
let doneDays = JSON.parse(localStorage.getItem('done_days') || '[]');
let isPlayingAll = false;
let playQueue = [];
let playIndex = 0;
let currentUtterance = null;

const dayKeys = Object.keys(COURSE_DATA).map(Number).sort((a,b)=>a-b);

function getDayData(day) {
  return COURSE_DATA[String(day)] || null;
}

function switchTab(tab) {
  document.getElementById('tab-learn').style.display = tab==='learn'?'block':'none';
  document.getElementById('tab-list').style.display = tab==='list'?'block':'none';
  document.getElementById('tab-saved').style.display = tab==='saved'?'block':'none';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', ['learn','list','saved'][i]===tab));
  if(tab==='list') renderDayList();
  if(tab==='saved') renderSavedList();
  if(tab!=='learn') stopAll();
}

function renderDay() {
  const d = getDayData(currentDay);
  if(!d) return;
  document.getElementById('day-label').textContent = 'Day ' + currentDay;
  document.getElementById('day-title').textContent = d.title;
  const container = document.getElementById('sentences-container');
  container.innerHTML = d.sentences.map((s, i) => {
    const isSaved = savedSentences.includes(s);
    return `<div class="sentence-card" id="sc-${i}" data-idx="${i}">
      <div class="sentence-en">${s}</div>
      <div class="sentence-actions">
        <button class="btn-speak" onclick="speakOne('${escQ(s)}', this)">🔊 듣기</button>
        <button class="btn-memo ${isSaved?'saved':''}" onclick="toggleSave('${escQ(s)}', this)">${isSaved?'★ 저장됨':'☆ 저장'}</button>
      </div>
    </div>`;
  }).join('');
  updateProgress();
}

function escQ(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

function changeDay(delta) {
  stopAll();
  const idx = dayKeys.indexOf(currentDay);
  const newIdx = idx + delta;
  if(newIdx < 0 || newIdx >= dayKeys.length) return;
  currentDay = dayKeys[newIdx];
  renderDay();
}

function goToDay(day) {
  stopAll();
  currentDay = day;
  renderDay();
  switchTab('learn');
}

function getSpeed() { return parseFloat(document.getElementById('speed-slider').value); }

function speakOne(text, btn) {
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = getSpeed();
  speechSynthesis.speak(u);
}

function toggleListenAll() {
  if(isPlayingAll) { stopAll(); return; }
  const d = getDayData(currentDay);
  if(!d) return;
  isPlayingAll = true;
  document.getElementById('listen-all-btn').textContent = '⏹ 정지';
  document.getElementById('listen-all-btn').classList.add('playing');
  playQueue = d.sentences.slice();
  playIndex = 0;
  playNext();
}

function playNext() {
  if(!isPlayingAll || playIndex >= playQueue.length) {
    stopAll();
    // 완료 시 done 처리
    if(!doneDays.includes(currentDay)) {
      doneDays.push(currentDay);
      localStorage.setItem('done_days', JSON.stringify(doneDays));
      updateProgress();
    }
    return;
  }
  // 이전 하이라이트 제거
  document.querySelectorAll('.sentence-card.playing').forEach(el=>el.classList.remove('playing'));
  const card = document.getElementById('sc-'+playIndex);
  if(card) { card.classList.add('playing'); card.scrollIntoView({behavior:'smooth', block:'nearest'}); }

  const u = new SpeechSynthesisUtterance(playQueue[playIndex]);
  u.lang = 'en-US';
  u.rate = getSpeed();
  u.onend = () => { playIndex++; setTimeout(playNext, 400); };
  u.onerror = () => { playIndex++; playNext(); };
  speechSynthesis.speak(u);
  currentUtterance = u;
}

function stopAll() {
  isPlayingAll = false;
  playQueue = [];
  if(window.speechSynthesis) speechSynthesis.cancel();
  const btn = document.getElementById('listen-all-btn');
  if(btn) { btn.textContent = '▶ 전체 듣기'; btn.classList.remove('playing'); }
  document.querySelectorAll('.sentence-card.playing').forEach(el=>el.classList.remove('playing'));
}

function toggleSave(sentence, btn) {
  const idx = savedSentences.indexOf(sentence);
  if(idx >= 0) {
    savedSentences.splice(idx, 1);
    btn.textContent = '☆ 저장';
    btn.classList.remove('saved');
  } else {
    savedSentences.push(sentence);
    btn.textContent = '★ 저장됨';
    btn.classList.add('saved');
  }
  localStorage.setItem('saved_sentences', JSON.stringify(savedSentences));
}

function updateProgress() {
  document.getElementById('progress-text').textContent = doneDays.length + ' / ' + dayKeys.length + ' 완료';
}

function renderDayList() {
  const list = document.getElementById('day-list');
  list.innerHTML = dayKeys.map(day => {
    const d = getDayData(day);
    const done = doneDays.includes(day);
    return `<div class="day-card ${done?'done':''}" onclick="goToDay(${day})">
      <div class="day-num-badge">${day}</div>
      <div class="day-card-info">
        <div class="day-card-label">Day ${day}</div>
        <div class="day-card-title">${d.title}</div>
      </div>
      <div class="day-card-count">${d.sentences.length}문장</div>
    </div>`;
  }).join('');
}

function renderSavedList() {
  const list = document.getElementById('saved-list');
  if(savedSentences.length === 0) {
    list.innerHTML = '<div class="empty-state">저장된 문장이 없습니다<br><br>학습 중 ☆ 저장 버튼을 눌러보세요</div>';
    return;
  }
  list.innerHTML = savedSentences.map((s, i) =>
    `<div class="saved-item">
      <span class="saved-sentence">${s}</span>
      <button class="btn-play-saved" onclick="speakOne('${escQ(s)}', this)">🔊</button>
      <button class="btn-del-saved" onclick="deleteSaved(${i})">✕</button>
    </div>`
  ).join('');
}

function deleteSaved(i) {
  savedSentences.splice(i, 1);
  localStorage.setItem('saved_sentences', JSON.stringify(savedSentences));
  renderSavedList();
}

// 초기 렌더
renderDay();
updateProgress();
</script>
